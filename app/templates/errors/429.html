{% extends "base.html" %}
{% block title %}Too Many Attempts{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
        <div class="card shadow-sm mt-4 text-center">
            <div class="card-body p-4">
                <i class="bi bi-hourglass-split display-4 text-danger"></i>
                <h1 class="h4 mt-3">Too Many Attempts</h1>
                <p class="text-muted">
                    Too many login attempts. Please wait a moment and try again.
                </p>
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
