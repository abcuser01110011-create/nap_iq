{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
        <div class="card shadow-sm mt-4 text-center">
            <div class="card-body p-4">
                <i class="bi bi-shield-lock display-4 text-danger"></i>
                <h1 class="h4 mt-3">Access Denied</h1>
                <p class="text-muted">
                    Your account doesn't have permission to view that page.
                </p>
                {% if current_user %}
                <a href="{{ url_for('auth.home') }}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i>Go to My Home Page
                </a>
                {% else %}
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
